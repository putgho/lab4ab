<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4b - Question 2</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <h2>Book Details</h2>
    <ul id="output"></ul>

    <script>

        // JSON data from Question 1 (books.json)
        const bookData = {
                            "books":
                            [
                                {
                                    "title":"The Great Gatsby",
                                    "author":"F. Scott Fitzgerald",
                                    "publicationYear":1925,
                                    "genres":["Fiction","Classics"]
                                },
                                {
                                    "title":"To Kill a Mockingbird",
                                    "author":"Harper Lee",
                                    "publicationYear":1960,
                                    "genres":["Fiction","Coming-of-Age"]
                                }
                            ]
                        };

        // (a) the title of the first book
        console.log(bookData.books[0].title);

        // (b) the author of the second book
        console.log(bookData.books[1].author);

        // (c) loop through the books and display the genres
        bookData.books.forEach(book => {
            console.log(book.genres);
        });

        // also display the same details on the page using jQuery
        $("#output").append("<li>(a) Title of the first book: " + bookData.books[0].title + "</li>");
        $("#output").append("<li>(b) Author of the second book: " + bookData.books[1].author + "</li>");
        bookData.books.forEach(book => {
            $("#output").append("<li>(c) Genres of " + book.title + ": " + book.genres.join(", ") + "</li>");
        });

    </script>
</body>
</html>
