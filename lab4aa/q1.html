<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 4a - Question 1</title>
</head>
<body>

  <div id="myElement">
    <p>Welcome to my website!</p>
  </div>

  <script>
    // Get the <p> inside the div with id "myElement"
    const paragraph = document.querySelector("#myElement p");

    // Change the text inside the <p>
    paragraph.innerHTML = "Hello there!";
  </script>

</body>
</html>
