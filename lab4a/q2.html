<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 4a - Question 2</title>
</head>
<body>

  <input type="text" id="userInput" placeholder="Enter a number">
  <button onclick="checkInput()">Check</button>

  <script>
    // Check if the number entered is lower or higher than 10
    function checkInput() {
      // Get the value typed by the user
      const value = document.getElementById("userInput").value.trim();

      // If empty or not a number (eg: alphabets), ask for a number
      if (value === "" || isNaN(value)) {
        alert("Please insert a number!");
      } else if (Number(value) < 10) {
        alert("The number is lower than 10");
      } else {
        alert("The number is higher than 10");
      }
    }
  </script>

</body>
</html>
